<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Giỏ Hàng</title>
<link rel="stylesheet" href="css/l.css">
</head>
<body>

<div class="header">
<a href="index.html">⬅ Trang chủ</a>
</div>

<h2 style="text-align:center;">🛒 Giỏ hàng</h2>
<ul id="cartItems" style="padding:40px;"></ul>
<h3 id="total" style="text-align:center;"></h3>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let list = document.getElementById("cartItems");
let total = 0;

cart.forEach((item,index) => {
    let li = document.createElement("li");
    li.innerHTML = item.name + " - " + item.price + "đ <button onclick='removeItem("+index+")'>Xóa</button>";
    list.appendChild(li);
    total += item.price;
});

document.getElementById("total").innerText = "Tổng tiền: " + total + "đ";

function removeItem(i){
    cart.splice(i,1);
    localStorage.setItem("cart", JSON.stringify(cart));
    location.reload();
}
</script>

</body>
</html>
