<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Login / Register</title>

<link rel="stylesheet" href="css/loginvaregister.css">

</head>

<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
    <h2>Đăng nhập</h2>

    <input type="text" id="loginUsername" placeholder="Tên đăng nhập" autocomplete="off">
    <input type="password" id="loginPassword" placeholder="Mật khẩu" autocomplete="new-password">

    <button onclick="login()">Đăng nhập</button>

    <p id="loginMsg"></p>

    <p>Chưa có tài khoản?
        <a href="#" onclick="showRegister()">Đăng ký</a>
    </p>
</div>

<!-- REGISTER -->
<div class="login-box" id="registerBox" style="display:none;">
    <h2>Đăng ký</h2>

    <input type="text" id="registerUsername" placeholder="Tên đăng nhập" autocomplete="off">
    <input type="password" id="registerPassword" placeholder="Mật khẩu" autocomplete="new-password">

    <button onclick="register()">Đăng ký</button>

    <p id="registerMsg"></p>

    <p>Đã có tài khoản?
        <a href="#" onclick="showLogin()">Đăng nhập</a>
    </p>
</div>

<script src="js/login.js"></script>

</body>
</html>
